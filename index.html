const inb=(r,c)=>r>=0&&c>=0&&r<N&&c<N;
function newTile(t,v,r,c,s=1.6){return{t,v:v||0,vx:c,vy:r,s,ph:Math.random()*6}}
function flood(r,c,t){
  const seen=new Set(),out=[],st=[[r,c]];
  while(st.length){const [y,x]=st.pop();const k=y*N+x;if(seen.has(k))continue;seen.add(k);
    const tl=grid[y][x];if(!tl||tl.t!==t)continue;out.push([y,x]);
    for(const [dy,dx] of D4){if(inb(y+dy,x+dx))st.push([y+dy,x+dx])}}
  return out;
}
function emptyCells(){const o=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])o.push([r,c]);return o}

  if(G&&!zen&&G.turn>=(sv?1:3)&&!(G.shield>0)&&grid.flat().filter(t=>t&&t.t===12).length<(sv?8:5)){const rt=(G.mode==='campaign'?G.S.rate*2.4:sv?Math.min(.2+G.turn*.004,.6):Math.min(.08+G.turn*.0015,.3))*(1-.08*tal('prod'));const k=rt*100/5;for(let v=0;v<5;v++)w.push([30+v,k])}

/* ---------- fusion ---------- */
function resolve(r,c){
  let chain=0;
  for(;;){
    const tl=grid[r][c];if(!tl)break;const nx=NEXT(tl.t);if(!nx)break;
    const g=flood(r,c,tl.t);if(g.length<NEED(tl.t))break;
    chain++;
    for(const [y,x] of g){if(y===r&&x===c)continue;G.ghosts.push({t:tl.t,v:tl.v,x:x,y:y,tx:c,ty:r,life:0});grid[y][x]=null}
    grid[r][c]=newTile(nx,0,r,c,1.7);
    const n=g.length,sup=n>NEED(tl.t),mult=n<4?1:(n-2)*(n-1)/2; // 3 → ×1, 4 → ×3, 5 → ×6, 6 → ×10…
    if(sup){grid[r][c].sup=1;addCoins(2*(n-3))}
    G.made[nx]=(G.made[nx]||0)+1;track('make',1,nx);
    const gain=Math.round((PTS[nx]||0)*mult*chain*(1+.05*tal('pts')+cardBonus()));G.score+=gain;addCoins(Math.max(1,nx-1)*(n-2));
    burst(r,c,12,['#ffd84a','#ff7ab8','#ffffff','#9be07a']);
    sfx.merge(chain+nx*.5);
    if(sup)toast('SUPER '+NAMES[nx].toUpperCase()+' ×'+mult+' ! +'+gain,1400);
    if(nx===6){toast('TOUR ÉRIGÉE !',2000);say('Magnifique, soldat ! Cette tour domine tout le secteur !')}
    else if(nx===5&&!G.flags.base){G.flags.base=1;toast('BASE CONSTRUITE')}
    if(chain>1)toast('COMBO x'+chain,1000);
  }
  if(chain>=2)track('combo',chain);
  return chain;
}
function crystalBest(r,c){
  for(const t of [6,5,4,3,2,1]){grid[r][c]={t};const g=flood(r,c,t);grid[r][c]=null;if(g.length>=NEED(t))return t}
  return 0;
}
function previewGroup(r,c){
  const cur=G.cur;if(cur===20||!inb(r,c)||grid[r][c])return [];
  let t=cur;if(cur===21){t=crystalBest(r,c);if(!t)return []}
  grid[r][c]={t};const g=flood(r,c,t);grid[r][c]=null;return g.length>=NEED(t)?g:[];
}

function previewChain(r,c){ // simule la pose sans rien changer : fusion directe puis réactions en chaîne
  const out={pg:[],extra:[],final:0,n:0};
  const cur=G.cur;if(cur===20||!inb(r,c)||grid[r][c])return out;
  let t=cur;if(cur===21){t=crystalBest(r,c);if(!t)return out}
  const save=grid.map(row=>row.slice());
  try{
    grid[r][c]={t};let n=0;
    for(;;){const tl=grid[r][c],nx=NEXT(tl.t);if(!nx)break;const g=flood(r,c,tl.t);if(g.length<NEED(tl.t))break;
      n++;if(n===1)out.pg=g;else g.forEach(([y,x])=>{if(!(y===r&&x===c))out.extra.push([y,x,n])});
      for(const [y,x] of g){if(y===r&&x===c)continue;grid[y][x]=null}
      grid[r][c]={t:nx};out.final=nx}
    out.n=n;
  }finally{for(let y=0;y<N;y++)for(let x=0;x<N;x++)grid[y][x]=save[y][x]}
  return out}

function prodromePhase(){

  mshuf(ps);
  if(G.freeze>0)ps.length=0;
  const step=(y,x)=>{const opts=D4.map(([dy,dx])=>[y+dy,x+dx]).filter(([a,b])=>inb(a,b)&&!grid[a][b]);if(!opts.length)return [y,x];const [a,b]=mpick(opts);grid[a][b]=grid[y][x];grid[y][x]=null;return [a,b]};
  let burned=0;
  for(const [y,x] of ps){
    const v=grid[y][x].v;let p=[y,x];
    if(v===1){if(G.turn%2===0)continue;p=step(y,x)}                 // Genbu : blindé, un tour sur deux
    else if(v===3){const o=[];for(let a=0;a<N;a++)for(let b=0;b<N;b++)if(!grid[a][b])o.push([a,b]);
      if(o.length){const [a,b]=mpick(o);grid[a][b]=grid[y][x];grid[y][x]=null;p=[a,b];burst(a,b,6,['#a0ff6a','#ffffff'])}}   // Gyuki : bondit
    else if(v===4){p=step(y,x);p=step(p[0],p[1])}                  // Gaoro : deux pas
    else p=step(y,x);                                              // Goki, Goryo : un pas
    if(v===0&&G.turn>3&&lm()<.4){                         // Goki : brûle une petite pièce voisine
      const nb=D4.map(([dy,dx])=>[p[0]+dy,p[1]+dx]).filter(([a,b])=>inb(a,b)&&grid[a][b]&&grid[a][b].t>=1&&grid[a][b].t<=3);
      if(nb.length){const [a,b]=mpick(nb);scoreDestroy(grid[a][b]);grid[a][b]=newTile(9,0,a,b,1.5);burst(a,b,12,['#ff9a3a','#ffd84a','#ff4f2a']);burned++}}
  }
  if(burned){toast('GOKI BRÛLE '+(burned>1?burned+' PIÈCES':'UNE PIÈCE'),1300);sfx.bad&&sfx.bad()}
  setTimeout(trapPhase,300);
}
function trapPhase(){
  const seen=new Set();let trapped=0;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const tl=grid[r][c];if(!tl||tl.t!==12||seen.has(r*N+c))continue;
    const comp=flood(r,c,12);comp.forEach(([y,x])=>seen.add(y*N+x));
    const free=comp.some(([y,x])=>D4.some(([dy,dx])=>inb(y+dy,x+dx)&&!grid[y+dy][x+dx]));
    if(!free){
      const boom=[];comp.forEach(([y,x])=>{if(grid[y][x].v===2)boom.push([y,x])});               // Goryo piégé : il explose
      let blast=0;boom.forEach(([y,x])=>D4.forEach(([dy,dx])=>{const a=y+dy,b=x+dx;if(inb(a,b)&&grid[a][b]&&grid[a][b].t>=1&&grid[a][b].t<=3){scoreDestroy(grid[a][b]);grid[a][b]=newTile(9,0,a,b,1.5);burst(a,b,10,['#ff9a3a','#ffd84a']);blast++}}));
      if(blast)toast('GORYO EXPLOSE !',1200);
      comp.forEach(([y,x])=>{grid[y][x]=newTile(9,0,y,x,1.5);burst(y,x,12,['#34c80a','#a0ff6a','#ffffff']);trapped++})}
  }

    if(!G.flags.trap){G.flags.trap=1;say("Prodromes piégés ! Trois ruines côte à côte forment une balise.")}
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(grid[r][c]&&grid[r][c].t===9)resolve(r,c)}
    if(trapped>=2&&(G.made[10]||0)>m10){const b=50*trapped*trapped;G.score+=b;toast('PIÈGE GROUPÉ ! +'+b,1600)}
  }

    const cand=emptyCells();
    if(cand.length){const [r,c]=pick(cand);{const v=randPro();grid[r][c]=newTile(12,v,r,c,.3);G.lastPro=v}burst(r,c,10,['#34c80a','#a0ff6a']);sfx.spawn();toast('BRÈCHE ! '+PR[G.lastPro].n.toUpperCase()+' SURGIT',1500);
      if(!G.flags.breach){G.flags.breach=1;say("Brèche détectée ! Un nouveau Prodrome vient de surgir.")}}
  }
  setTimeout(endTurn,260);
}

      <p style="text-align:center">Score : <span class="px" style="font-size:12px;color:#ffd84a">${G.score}</span><br>Meilleur : ${save.best[key]} · ${G.turn} tours<br><span style="color:#7df0ff">+${frag} fragments</span>${crate?'<br><span style="color:#ffd84a">+1 colis de ravitaillement</span>':''}${beat?'<br><b style="color:#ff7ab8">NOUVEAU RECORD !</b>':(prev>0&&gap>0&&gap<=prev*.35?`<br><span style="color:#ffd84a">Plus que ${gap} points pour battre ton record !</span>`:'')}</p>
      ${newH.length?`<p style="text-align:center;color:#7be05a">Nouveau héros débloqué : ${newH.map(id=>HN[hIdx(id)]).join(', ')} !</p>`:''}<div class="mrow">${btns.join('')}</div>`,a=>{

const bgc=$('bg'),bx=bgc.getContext('2d');let sky=null;
function initBg(){
  const W=Math.ceil(innerWidth/3),H=Math.ceil(innerHeight/3);bgc.width=W;bgc.height=H;
  const mkLayer=(minH,varH,wMin,wVar)=>{const arr=[];let x=-4;while(x<W){const w=wMin+rnd(wVar),h=Math.floor(H*minH)+rnd(Math.floor(H*varH));const cut=rnd(3),prof=[];
    for(let i=0;i<w;i++){let hh=h;if(cut===1)hh-=Math.max(0,Math.floor((i-w*.4)*(.8+Math.random()*.6)));else if(cut===2)hh-=Math.max(0,Math.floor((w*.6-i)*.9));if(i%4===0&&Math.random()<.3)hh-=rnd(3);prof.push(Math.max(6,hh))}
    arr.push({x,w,prof,s:rnd(1e6)});x+=w-rnd(3)}return arr};
  const st=[];for(let i=0;i<50;i++)st.push({x:rnd(W),y:rnd(Math.floor(H*.4)),p:Math.random()*6});
  sky={W,H,far:mkLayer(.16,.2,10,16),near:mkLayer(.22,.3,12,18),st};
}
function drawBg(ts){
  if(!sky)return;const {W,H,far,near,st}=sky,g=bx;
  const bands=['#0d0a1e','#170e30','#26123f','#3d1650','#5e1c5c','#8a2a6a','#bd4a82'];
  const bh=Math.ceil(H*.72/bands.length);
  bands.forEach((c,i)=>{g.fillStyle=c;g.fillRect(0,i*bh,W,bh+1)});
  g.fillStyle='#bd4a82';g.fillRect(0,bands.length*bh,W,H);
  st.forEach(s=>{g.fillStyle=Math.sin(ts/500+s.p)>0?'#fff':'#8a7ac8';g.fillRect(s.x,s.y,1,1)});
  const cx=Math.floor(W*.5+Math.sin(ts/3000)*6),cy=Math.floor(H*.12);
  for(let dy=-5;dy<=5;dy++){const hw=Math.floor(Math.min(34,W*.4)*Math.sqrt(1-(dy/6)*(dy/6)));g.fillStyle=dy<0?'#3a2070':'#24124a';g.fillRect(cx-hw,cy+dy,hw*2,1)}
  for(let i=-3;i<=3;i++){g.fillStyle=(Math.floor(ts/300)+i)%3===0?'#34c80a':'#1b6a06';g.fillRect(cx+i*8,cy+2,2,1)}
  const draw=(L,col,win)=>L.forEach(o=>{
    for(let i=0;i<o.w;i++){const x=o.x+i,hh=o.prof[i],top=H-hh;g.fillStyle=col;g.fillRect(x,top,1,hh);
      if(win&&i%3===1&&i>1&&i<o.w-1){for(let y=top+4;y<H-3;y+=4){const q=hash(o.s+x*31+y*7);if(q%6===0){g.fillStyle=q%4===0?'#ff9ed0':(q%5===0?'#ffd84a':'#3a2a58');g.fillRect(x,y,1,2)}}}}
    if(win){g.fillStyle='#1f1230';g.fillRect(o.x,H-o.prof[0],1,o.prof[0])}
  });
  draw(far,'#3a1d58',false);draw(near,'#150c22',true);
  g.fillStyle='#0a0612';g.fillRect(0,H-3,W,3);
  for(let x=0;x<W;x+=7){const q=hash(x*13);g.fillRect(x,H-3-q%3,3+q%3,3)}
}

(function(){

  const fix=n=>{if(n.nodeType===3){const p=n.parentElement;if(p&&/Press Start/.test(getComputedStyle(p).fontFamily)){const u=strip(n.nodeValue);if(u!==n.nodeValue)n.nodeValue=u}}
    else if(n.nodeType===1)n.childNodes.forEach(fix)};
  new MutationObserver(ms=>ms.forEach(m=>{if(m.type==='characterData')fix(m.target);else m.addedNodes.forEach(fix)})).observe(document.body,{subtree:true,childList:true,characterData:true});
