  const OUT=hx('#1a0f2a'),CL=hx('#c4bed6'),CD=hx('#6a6480'),CM=hx('#8f89a6'),A0=hx('#2b2733'),A1=hx('#35303f'),A2=hx('#221e2b'),WD=hx('#cfcad8'),CR=hx('#120c1c'),GV=hx('#2f6b3c'),GL=hx('#58c46a'),RB=hx('#5a5470');

  // lignes blanches : routes étroites uniquement
  lanes.forEach(([cx,cy,dx,dy])=>{for(let t=5;t<17;t++){if(Math.floor(t/4)%2)continue;for(let o=-1;o<=0;o++){const x=Math.floor(cx+dx*t+(dy?o:0)+(dx<0?-1:0)),y=Math.floor(cy+dy*t+(dx?o:0)+(dy<0?-1:0));if(ins(x,y))put(x,y,WD)}}});

      if(all){for(let y=cy-4;y<=cy+4;y++)for(let x=cx-5;x<=cx+5;x++){const e=((x-cx)/5)**2+((y-cy)/3.6)**2;if(e<=1&&ok(x,y))put(x,y,e>.62?(y<cy?CR:A2):CR);else if(e<=1.35&&e>1&&ok(x,y))put(x,y,RB)}

        crack(cx+4,cy+1,9)}}}
  oc.putImageData(img,0,0);
}

function tsClean(im){ // retire le liseré sombre de bord de case (sinon quadrillage visible entre cases)
  const W=im.width,H=im.height,c=cvs(W,H),g=c.getContext('2d');g.drawImage(im,0,0);const id=g.getImageData(0,0,W,H),d=id.data;
  const L=(x,y)=>{const i=(y*W+x)*4;return .3*d[i]+.59*d[i+1]+.11*d[i+2]};
  const cp=(x,y,sx,sy)=>{const a=(y*W+x)*4,b=(sy*W+sx)*4;d[a]=d[b];d[a+1]=d[b+1];d[a+2]=d[b+2]};
  for(let ty=0;ty<H/32;ty++)for(let tx=0;tx<W/32;tx++){const X=tx*32,Y=ty*32,floor=(ty*9+tx)<3;
    const edges=[];for(let k=0;k<32;k++){edges.push([X+k,Y,X+k,Y+1,X+k,Y+2],[X+k,Y+31,X+k,Y+30,X+k,Y+29],[X,Y+k,X+1,Y+k,X+2,Y+k],[X+31,Y+k,X+30,Y+k,X+29,Y+k])}
    edges.forEach(([x,y,ix,iy,jx,jy])=>{if(L(x,y)>45)return;const li=L(ix,iy),lj=L(jx,jy);if(floor||li>=55&&li<=80||(li>200&&lj<80))cp(x,y,ix,iy)})}
  g.putImageData(id,0,0);return c}
function tsTile(g,k,flip){const key=g+'_'+k+'_'+(flip?1:0);let c=TS.c.get(key);if(c)return c;
  const i=g*3+k,sx=(i%9)*32,sy=Math.floor(i/9)*32;c=cvs(32,32);const x=c.getContext('2d');
  if(flip){x.translate(0,32);x.scale(1,-1)}x.drawImage(TS.img,sx,sy,32,32,0,0,32,32);TS.c.set(key,c);return c}
function tsPlaza(mask,k){ // mask bits : N=1 E=2 S=4 W=8 murs pleins ; 16/32/64/128 = mur avec embouchure de route N/E/S/W
  const key='P'+mask+'_'+k;let c=TS.c.get(key);if(c)return c;
  c=cvs(32,32);const g=c.getContext('2d'),h=tsTile(1,k),v=tsTile(2,k),hd=h.getContext('2d').getImageData(0,0,32,32).data,vd=v.getContext('2d').getImageData(0,0,32,32).data,fd=tsTile(1,0).getContext('2d').getImageData(0,0,32,32).data;
  const im=g.createImageData(32,32),d=im.data,set=(x,y,s,sx,sy)=>{const a=(y*32+x)*4,b=(sy*32+sx)*4;d[a]=s[b];d[a+1]=s[b+1];d[a+2]=s[b+2];d[a+3]=255};
  for(let y=0;y<32;y++)for(let x=0;x<32;x++)set(x,y,fd,4+rh(x,y,k+9)%24,8+rh(x,y,k+3)%4);
  const mouthH=y=>y>=7&&y<25,mouthV=x=>x>=7&&x<24;
  for(let x=0;x<32;x++){
    if((mask&1)||((mask&16)&&!mouthV(x)))for(let y=0;y<7;y++)set(x,y,hd,x,y);
    if((mask&4)||((mask&64)&&!mouthV(x)))for(let y=25;y<32;y++)set(x,y,hd,x,y)}
  for(let y=0;y<32;y++){
    if((mask&8)||((mask&128)&&!mouthH(y)))for(let x=0;x<7;x++)set(x,y,vd,x,y);
    if((mask&2)||((mask&32)&&!mouthH(y)))for(let x=24;x<32;x++)set(x,y,vd,x,y)}
  g.putImageData(im,0,0);TS.c.set(key,c);return c}
function drawTiles(oc,em,pz){
  oc.imageSmoothingEnabled=false;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const hv=rh(r,c,77)%100,k=hv<50?0:hv<78?1:2;
    oc.drawImage(tsTile(0,rh(r,c,5)%3),c*C,r*C);
    if(!em(r,c))continue;
    if(pz(r,c)){let m=0;[[-1,0,1,16],[0,1,2,32],[1,0,4,64],[0,-1,8,128]].forEach(([dy,dx,f,fm])=>{const y=r+dy,x=c+dx;if(!inb(y,x))return;if(!em(y,x))m|=f;else if(!pz(y,x))m|=fm});
      oc.drawImage(tsPlaza(m,k),c*C,r*C);continue}
    const n=em(r-1,c),e=em(r,c+1),s=em(r+1,c),w=em(r,c-1),cnt=n+e+s+w;let g=16,fl=false;
    if(cnt===4)g=11;
    else if(cnt===3)g=!n?7:!e?10:!s?7:9,fl=!s;

    for(const [dy,dx] of rc){const y=r+dy,x=c+dx;if(inb(y,x)&&floorC[y][x]){floorC[y][x]=false;n++;burst(y,x,7,['#ffd3e6','#ffffff','#ff7ab8'])}}

}
function endTurn(){
  if(G.pcd>0)G.pcd--;if(G.freeze>0)G.freeze--;if(G.shield>0)G.shield--;

  if(objDone()){return finish(true)}

function finish(win){
  G.over=true;G.busy=true;updateHud();
  const key=G.mode==='campaign'?'s'+G.si:'inf';
  if(!save.best[key]||G.score>save.best[key])save.best[key]=G.score;
  const before=PICK.filter(isOpen);
  if(win&&G.mode==='campaign')save.done[G.si]=true;persist();
  const newH=PICK.filter(id=>isOpen(id)&&!before.includes(id));
  if(win){sfx.win();say("Secteur reconquis. Beau travail, soldat !")}else{sfx.lose();say("Plus de place... Repli ! On reviendra plus fort.")}
  setTimeout(()=>{
    const last=G.mode==='campaign'&&G.si===SECTORS.length-1;
    const btns=[];
    if(win&&G.mode==='campaign'&&!last)btns.push(`<button class="btn pk" data-a="next">SECTEUR SUIVANT</button>`);
    btns.push(`<button class="btn" data-a="again">REJOUER</button>`,`<button class="btn cy" data-a="menu">MENU</button>`);
    showModal(`<h2>${win?(last?'ERRET EST LIBÉRÉE !':'SECTEUR RECONQUIS'):'SECTEUR PERDU'}</h2>
      <p style="text-align:center">Score : <span class="px" style="font-size:12px;color:#ffd84a">${G.score}</span><br>Meilleur : ${save.best[key]} · ${G.turn} tours</p>
      ${newH.length?`<p style="text-align:center;color:#7be05a">Nouveau héros débloqué : ${newH.map(id=>HN[hIdx(id)]).join(', ')} !</p>`:''}<div class="mrow">${btns.join('')}</div>`,a=>{
        hideModal();
        if(a==='next')startCampaign(G.si+1);else if(a==='again')(G.mode==='campaign'?startCampaign(G.si):startEndless());else toMenu();
      });

}

function startGame(mode,si,hero){
  const S=mode==='campaign'?SECTORS[si]:ENDLESS;
  G={mode,si,S,hero:hero||(G&&G.hero)||'duke',pcd:2,freeze:0,shield:0,coins:0,armed:false,swapA:null,seed:Math.floor(Math.random()*999),score:0,shown:0,turn:0,busy:false,over:false,sel:null,cur:null,res:null,made:{},freed:0,ghosts:[],parts:[],flags:{}};
  grid=[...Array(N)].map(()=>Array(N).fill(null));
  floorC=[...Array(N)].map(()=>Array(N).fill(false));
  buildFloors();
  let n=0,tries=0;const want=Math.max(9,Math.min(15,22-S.pro));
  while(n<want&&tries++<600){const r=rnd(N),c=rnd(N);if(grid[r][c])continue;const t=pick([1,1,1,1,1,1,2,2,2,3]);
    grid[r][c]=newTile(t,0,r,c,1);if(flood(r,c,t).length>=3){grid[r][c]=null;continue}n++}
  shuffle(emptyCells()).slice(0,S.pro).forEach(([r,c])=>grid[r][c]=newTile(12,randPro(),r,c,1));
  G.cur=randPiece();
  show('game');resize();updateHud();
  say(S.intro);
}
const startCampaign=i=>startGame('campaign',i,save.hero);
const startEndless=()=>startGame('endless',0,save.hero);

function onCell(r,c,pt){
  if(!G||G.busy||G.over)return;
  const same=G.sel&&G.sel[0]===r&&G.sel[1]===c;
  if(!valid(r,c)){G.sel=null;sfx.bad();return}
  if(G.armed)usePower(r,c);else place(r,c)
}
function swapReserve(){
  if(!G||G.busy||G.over)return;
  G.armed=false;G.swapA=null;
  if(G.res==null){G.res=G.cur;G.cur=randPiece()}else{[G.cur,G.res]=[G.res,G.cur]}
  G.sel=null;sfx.sel();updateHud();
}

}

    sfx.place();updateHud();openShop();

  $('mbox').querySelectorAll('canvas[data-t]').forEach(cv=>{const t=+cv.dataset.t;const g=cv.getContext('2d');g.imageSmoothingEnabled=false;if(t>0)g.drawImage(spriteCanvas(t,0,0),0,0,64,64);else if(t===0)drawHeroTo(cv,G.hero);else{g.fillStyle='#6a6a58';g.font='bold 44px sans-serif';g.textAlign='center';g.fillText('↶',32,46)}});

/* ---------- décor : ville en ruine au crépuscule ---------- */
const bgc=$('bg'),bx=bgc.getContext('2d');let sky=null;
function initBg(){
  const W=Math.ceil(innerWidth/3),H=Math.ceil(innerHeight/3);bgc.width=W;bgc.height=H;
  const mkLayer=(minH,varH,wMin,wVar)=>{const arr=[];let x=-4;while(x<W){const w=wMin+rnd(wVar),h=Math.floor(H*minH)+rnd(Math.floor(H*varH));const cut=rnd(3),prof=[];
    for(let i=0;i<w;i++){let hh=h;if(cut===1)hh-=Math.max(0,Math.floor((i-w*.4)*(.8+Math.random()*.6)));else if(cut===2)hh-=Math.max(0,Math.floor((w*.6-i)*.9));if(i%4===0&&Math.random()<.3)hh-=rnd(3);prof.push(Math.max(6,hh))}
    arr.push({x,w,prof,s:rnd(1e6)});x+=w-rnd(3)}return arr};
  const st=[];for(let i=0;i<50;i++)st.push({x:rnd(W),y:rnd(Math.floor(H*.4)),p:Math.random()*6});
  sky={W,H,far:mkLayer(.16,.2,10,16),near:mkLayer(.22,.3,12,18),st};
}
function drawBg(ts){
  if(!sky)return;const {W,H,far,near,st}=sky,g=bx;
  const bands=['#0d0a1e','#170e30','#26123f','#3d1650','#5e1c5c','#8a2a6a','#bd4a82'];
  const bh=Math.ceil(H*.72/bands.length);
  bands.forEach((c,i)=>{g.fillStyle=c;g.fillRect(0,i*bh,W,bh+1)});
  g.fillStyle='#bd4a82';g.fillRect(0,bands.length*bh,W,H);
  st.forEach(s=>{g.fillStyle=Math.sin(ts/500+s.p)>0?'#fff':'#8a7ac8';g.fillRect(s.x,s.y,1,1)});
  const cx=Math.floor(W*.5+Math.sin(ts/3000)*6),cy=Math.floor(H*.12);
  for(let dy=-5;dy<=5;dy++){const hw=Math.floor(Math.min(34,W*.4)*Math.sqrt(1-(dy/6)*(dy/6)));g.fillStyle=dy<0?'#3a2070':'#24124a';g.fillRect(cx-hw,cy+dy,hw*2,1)}
  for(let i=-3;i<=3;i++){g.fillStyle=(Math.floor(ts/300)+i)%3===0?'#34c80a':'#1b6a06';g.fillRect(cx+i*8,cy+2,2,1)}
  const draw=(L,col,win)=>L.forEach(o=>{
    for(let i=0;i<o.w;i++){const x=o.x+i,hh=o.prof[i],top=H-hh;g.fillStyle=col;g.fillRect(x,top,1,hh);
      if(win&&i%3===1&&i>1&&i<o.w-1){for(let y=top+4;y<H-3;y+=4){const q=hash(o.s+x*31+y*7);if(q%6===0){g.fillStyle=q%4===0?'#ff9ed0':(q%5===0?'#ffd84a':'#3a2a58');g.fillRect(x,y,1,2)}}}}
    if(win){g.fillStyle='#1f1230';g.fillRect(o.x,H-o.prof[0],1,o.prof[0])}
  });
  draw(far,'#3a1d58',false);draw(near,'#150c22',true);
  g.fillStyle='#0a0612';g.fillRect(0,H-3,W,3);
  for(let x=0;x<W;x+=7){const q=hash(x*13);g.fillRect(x,H-3-q%3,3+q%3,3)}
}

/* Press Start 2P n'a pas de bonnes majuscules accentuées : on retire les accents dans les textes qui l'utilisent */
(function(){
  const strip=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const fix=n=>{if(n.nodeType===3){const p=n.parentElement;if(p&&/Press Start/.test(getComputedStyle(p).fontFamily)){const u=strip(n.nodeValue);if(u!==n.nodeValue)n.nodeValue=u}}
    else if(n.nodeType===1)n.childNodes.forEach(fix)};
  new MutationObserver(ms=>ms.forEach(m=>{if(m.type==='characterData')fix(m.target);else m.addedNodes.forEach(fix)})).observe(document.body,{subtree:true,childList:true,characterData:true});
  window.addEventListener('load',()=>{fix(document.body);document.fonts&&document.fonts.ready.then(()=>fix(document.body))});
})();
</script>
